<!DOCTYPE html>
<html data-theme="dark">
<head>
  <meta charset="utf-8">
  <style>
    /* Photoshop dark panel chrome */
    :root {
      --bg: #323232;
      --well: #2b2b2b;
      --well-border: #3f3f3f;
      --btn: #454545;
      --btn-hover: #525252;
      --btn-active: #3a3a3a;
      --btn-border: #545454;
      --accent: #1473e6;
      --accent-hover: #0d66d0;
      --accent-active: #0b57c2;
      --text: #e3e3e3;
      --text-2: #a5a5a5;
      --text-3: #7d7d7d;
      --divider: #454545;
      --error: #ff6b6b;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Adobe Clean", sans-serif;
      font-size: 12px;
      line-height: 1.4;
      overflow: auto;
    }

    .panel {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
    }

    /* header: icon + title, left aligned like every other Photoshop panel */
    .head {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panel-icon {
      display: none;
    }

    .head-text {
      min-width: 0;
    }

    .title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.1px;
    }

    .subtitle {
      font-size: 11px;
      color: var(--text-3);
      margin-top: 1px;
    }

    /* read-only value well, as used for fields in Photoshop's own panels */
    .well {
      background: var(--well);
      border: 1px solid var(--well-border);
      border-radius: 2px;
      padding: 6px 8px;
      min-width: 0;
    }

    .path {
      font-size: 11px;
      color: var(--text-2);
      word-break: break-all;
      overflow-wrap: anywhere;
      user-select: text;
    }

    .meta {
      font-size: 11px;
      color: var(--text-3);
      margin-top: 3px;
      overflow-wrap: anywhere;
    }

    /* buttons: 26px tall, flat, 2px radius */
    .btn {
      display: block;
      width: 100%;
      height: 26px;
      padding: 0 10px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 400;
      color: var(--text);
      background: var(--btn);
      border: 1px solid var(--btn-border);
      border-radius: 2px;
      cursor: pointer;
      text-align: center;
    }

    .btn:hover {
      background: var(--btn-hover);
    }

    .btn:active {
      background: var(--btn-active);
    }

    .btn:focus-visible {
      outline: 1px solid var(--accent);
      outline-offset: -1px;
    }

    .btn-primary {
      color: #ffffff;
      background: var(--accent);
      border-color: var(--accent);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .btn-primary:active {
      background: var(--accent-active);
      border-color: var(--accent-active);
    }

    .status {
      font-size: 11px;
      color: var(--text-2);
      min-height: 14px;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .status.error {
      color: var(--error);
    }

    .status:empty {
      min-height: 0;
    }

    /* section break, as in Photoshop's own panels */
    .section {
      margin-top: 2px;
      padding-top: 10px;
      border-top: 1px solid var(--divider);
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-2);
      margin-bottom: 6px;
    }

    .hint {
      font-size: 11px;
      color: var(--text-3);
      margin-top: 6px;
    }

    /* Photoshop's light UI */
    [data-theme="light"] {
      --bg: #e8e8e8;
      --well: #f7f7f7;
      --well-border: #d5d5d5;
      --btn: #e1e1e1;
      --btn-hover: #d8d8d8;
      --btn-active: #cccccc;
      --btn-border: #c7c7c7;
      --text: #333333;
      --text-2: #5c5c5c;
      --text-3: #7a7a7a;
      --divider: #d0d0d0;
      --error: #d7373f;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="head">
      <div class="head-text">
        <div class="title">Production Processor</div>
        <div class="subtitle">AI Reference Retriever</div>
      </div>
    </div>

    <div class="well">
      <div class="path" id="folderPath">Not set</div>
      <div class="meta" id="toolInfo"></div>
    </div>

    <button class="btn btn-primary" id="launchBtn">Open Retriever</button>
    <button class="btn" id="boardBtn">Open Board Folder</button>

    <div class="status" id="status"></div>

    <div class="section">
      <div class="section-title">Setup</div>
      <button class="btn" id="folderBtn">Choose Retriever Folder</button>
      <div class="hint">Saved on this PC, and used every time Photoshop starts.</div>
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
